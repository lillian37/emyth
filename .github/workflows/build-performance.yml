name: Build performance test APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/build-performance.yml'
      - 'app/src/main/java/dev/emyth/app/data/tea/**'
      - 'app/src/test/java/dev/emyth/app/data/tea/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-performance.yml'
      - 'app/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Select the source revision
        run: |
          emyth_source_revision="$(git log -1 --format=%H -- . ':(exclude).github/**')"
          test -n "$emyth_source_revision"
          git checkout --detach "$emyth_source_revision"
          echo "Building source revision: $emyth_source_revision"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Inspect preinstalled Android SDK
        run: ls "$ANDROID_HOME/platforms"

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: '10'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: web-ui/pnpm-lock.yaml

      - name: Install web UI dependencies
        working-directory: web-ui
        run: pnpm install --frozen-lockfile

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build optimized APK
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assemblePerformance --no-daemon --max-workers=2

      - name: Verify test package and optimization outputs
        run: |
          performance_apk=app/build/outputs/apk/performance/app-arm64-v8a-performance.apk
          performance_apkanalyzer="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -x "$performance_apkanalyzer"
          test -f "$performance_apk"
          test "$("$performance_apkanalyzer" manifest application-id "$performance_apk")" = 'dev.emyth.app.perf'
          test "$("$performance_apkanalyzer" manifest debuggable "$performance_apk")" = 'false'
          test -s app/build/outputs/mapping/performance/mapping.txt
          sha256sum "$performance_apk" > "$performance_apk.sha256"

      - name: Upload APK and checksum
        uses: actions/upload-artifact@v4
        with:
          name: emyth-performance-${{ github.run_number }}
          path: |
            app/build/outputs/apk/performance/app-arm64-v8a-performance.apk
            app/build/outputs/apk/performance/app-arm64-v8a-performance.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emyth-unit-test-reports-${{ github.run_number }}
          path: |
            app/build/reports/tests/testDebugUnitTest/
            app/build/test-results/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload R8 mapping
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emyth-performance-mapping-${{ github.run_number }}
          path: app/build/outputs/mapping/performance/mapping.txt
          if-no-files-found: ignore
          retention-days: 14
